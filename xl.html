<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flight Load Lookup</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

.container {
    width: min(1100px, 94%);
    margin: 40px auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 5vw, 42px);
}

.header p {
    margin: 0;
    color: #68737d;
    font-size: 16px;
}


/* =========================================================
   SEARCH BOX
========================================================= */

.search-box {
    background: white;
    border-radius: 14px;
    padding: 22px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.08);

    display: grid;

    grid-template-columns:
        1.2fr 1fr 1fr auto auto;

    gap: 14px;

    align-items: end;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 7px;
    font-size: 14px;
}

input,
button {
    width: 100%;
    min-height: 46px;
    border-radius: 8px;
    font-size: 16px;
}

input {
    border: 1px solid #cbd2d9;
    padding: 10px 12px;
    background: white;
}

button {
    border: 0;
    padding: 10px 22px;
    background: #1d4ed8;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.key-button {
    background: #374151;
}

.key-button:hover {
    background: #1f2937;
}


/* =========================================================
   STATUS
========================================================= */

#status {
    text-align: center;
    margin: 20px 0;
    color: #68737d;
    min-height: 22px;
}

.error {
    color: #b42318 !important;
    font-weight: 700;
}


/* =========================================================
   COLLAPSIBLE SEARCH DIAGNOSTICS
========================================================= */

.diagnostic-details {
    margin-top: 18px;

    background: #eef2ff;

    border-radius: 10px;

    color: #3730a3;

    overflow: hidden;
}

.diagnostic-details summary {
    cursor: pointer;

    padding: 13px 16px;

    font-size: 14px;

    font-weight: 800;

    user-select: none;
}

.diagnostic-details summary:hover {
    background: #e0e7ff;
}

.diagnostic-details[open] summary {
    border-bottom:
        1px solid #c7d2fe;
}

#diagnosticContent {
    padding: 15px;

    font-size: 13px;

    line-height: 1.8;
}

.diagnostic-title {
    font-weight: 800;

    margin-bottom: 8px;
}

.route-debug {
    margin-top: 12px;

    background: white;

    border-radius: 7px;

    padding: 10px;

    overflow-x: auto;
}

.route-debug table {
    width: 100%;

    border-collapse: collapse;

    font-size: 12px;
}

.route-debug th,
.route-debug td {
    padding: 7px 8px;

    border-bottom:
        1px solid #e5e7eb;

    text-align: left;
}

.route-debug th {
    font-weight: 800;
}


/* =========================================================
   RESULTS
========================================================= */

.result {
    background: white;

    border-radius: 14px;

    margin-top: 18px;

    padding: 22px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

.route {
    display: flex;

    justify-content:
        space-between;

    gap: 15px;

    align-items: center;

    flex-wrap: wrap;

    border-bottom:
        1px solid #e5e7eb;

    padding-bottom: 15px;

    margin-bottom: 18px;
}

.route-title {
    font-size: 25px;

    font-weight: 800;
}

.route-date {
    color: #68737d;

    font-size: 15px;
}


/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-bottom: 18px;
}

.stat {
    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    padding: 15px;
}

.stat-label {
    color: #68737d;

    font-size: 13px;

    margin-bottom: 5px;
}

.stat-value {
    font-size: 25px;

    font-weight: 800;
}


/* =========================================================
   AVAILABILITY TABLE
========================================================= */

.availability {
    width: 100%;

    border-collapse: collapse;

    border-radius: 10px;

    overflow: hidden;
}

.availability th,
.availability td {
    padding: 13px 12px;

    text-align: center;

    border-bottom:
        1px solid #e5e7eb;
}

.availability th {
    background: #f7f8fa;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: .03em;
}

.availability td:first-child,
.availability th:first-child {
    text-align: left;
}

.availability tr:last-child td {
    border-bottom: 0;

    font-weight: 800;
}


/* =========================================================
   DATA PULLED
========================================================= */

.pulled {
    margin-top: 15px;

    color: #68737d;

    font-size: 13px;
}


/* =========================================================
   RAW DATA
========================================================= */

.raw-data {
    margin-top: 18px;
}

.raw-data summary {
    cursor: pointer;

    font-weight: 700;

    color: #374151;
}

.raw-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px 18px;

    margin-top: 12px;
}

.raw-item {
    padding: 8px 0;

    border-bottom:
        1px solid #eee;
}

.raw-item strong {
    display: block;

    font-size: 12px;

    color: #68737d;

    margin-bottom: 3px;
}


/* =========================================================
   KEY MODAL
========================================================= */

.key-modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        rgba(0,0,0,.55);

    padding: 30px 15px;

    overflow-y: auto;
}

.key-modal.open {
    display: block;
}

.key-modal-content {
    width: min(900px, 100%);

    margin: 30px auto;

    background: white;

    border-radius: 14px;

    padding: 22px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

.key-modal-header {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 18px;
}

.key-modal-header h2 {
    margin: 0;

    font-size: 26px;
}

.key-close {
    width: auto;

    min-height: auto;

    padding: 7px 13px;

    background: #e5e7eb;

    color: #111827;

    font-size: 20px;
}

.key-close:hover {
    background: #d1d5db;
}

.key-table-wrap {
    overflow-x: auto;
}

.key-table {
    width: 100%;

    border-collapse: collapse;
}

.key-table th,
.key-table td {
    padding: 12px 10px;

    border-bottom:
        1px solid #e5e7eb;

    text-align: left;
}

.key-table th {
    background: #f7f8fa;

    font-size: 13px;

    text-transform: uppercase;
}

.key-loading,
.key-error,
.key-empty {
    text-align: center;

    padding: 25px 10px;

    color: #68737d;
}

.key-error {
    color: #b42318;

    font-weight: 700;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    text-align: center;

    color: #89929b;

    font-size: 12px;

    margin: 28px 0;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 760px) {

    .search-box {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .availability {
        font-size: 14px;
    }

    .availability th,
    .availability td {
        padding: 10px 6px;
    }

    .raw-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <h1>
            Flight Load Lookup
        </h1>

        <p>
            Search the latest flight availability from the Google Sheet.
        </p>

    </div>



    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <form
        class="search-box"
        id="searchForm"
    >


        <div>

            <label for="flightDate">
                Flight Date
            </label>

            <input
                type="date"
                id="flightDate"
                required
            >

        </div>


        <div>

            <label for="fromAirport">
                From Airport
            </label>

            <input
                type="text"
                id="fromAirport"
                placeholder="MCO"
                maxlength="5"
                required
            >

        </div>


        <div>

            <label for="toAirport">
                To Airport
            </label>

            <input
                type="text"
                id="toAirport"
                placeholder="DFW"
                maxlength="5"
                required
            >

        </div>


        <button
            type="submit"
            id="searchButton"
        >
            Search
        </button>


        <button
            type="button"
            id="keyButton"
            class="key-button"
        >
            Key
        </button>


    </form>



    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div id="status"></div>



    <!-- =====================================================
         RESULTS
    ====================================================== -->

    <div id="results"></div>



    <!-- =====================================================
         COLLAPSIBLE SEARCH DIAGNOSTICS
    ====================================================== -->

    <details
        id="diagnosticDetails"
        class="diagnostic-details"
    >

        <summary>
            🔍 Search Diagnostics
        </summary>


        <div id="diagnosticContent">

            Run a search to view diagnostics.

        </div>

    </details>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">

        Data is retrieved directly from the public Google Sheet.

    </div>


</div>



<!-- =========================================================
     KEY MODAL
========================================================= -->

<div
    id="keyModal"
    class="key-modal"
    aria-hidden="true"
>

    <div class="key-modal-content">


        <div class="key-modal-header">

            <h2>
                Flight Key
            </h2>


            <button
                type="button"
                id="keyCloseButton"
                class="key-close"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div id="keyContent">

            <div class="key-loading">
                Loading Sheet1...
            </div>

        </div>


    </div>

</div>



<script>


/* =========================================================
   GOOGLE SHEET SETTINGS
========================================================= */

const SPREADSHEET_ID =
    "1d-oZCR18gyXyu6V49iIL72LmeznRFgBj";


const MAIN_SHEET_GID =
    "1815369779";


const KEY_SPREADSHEET_ID =
    "1YgSFUzcBSBFgTrzr57MfodVff5-9P2qnvE3PNTicK7M";



/* =========================================================
   COLUMN POSITIONS
========================================================= */

const COL = {

    FLIGHT_DATE: 0,

    FROM: 1,

    TO: 2,

    TOTAL_AVAILABLE: 3,

    TOTAL_NONREVS: 4,

    FIRST_AVAILABLE: 5,

    FIRST_NONREVS: 6,

    MAIN_AVAILABLE: 7,

    MAIN_NONREVS: 8,

    BUSINESS_AVAILABLE: 9,

    BUSINESS_NONREVS: 10,

    PREMIUM_AVAILABLE: 11,

    PREMIUM_NONREVS: 12,

    DATA_PULLED: 13

};



/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );


const resultsEl =
    document.getElementById(
        "results"
    );


const diagnosticEl =
    document.getElementById(
        "diagnosticContent"
    );


const diagnosticDetails =
    document.getElementById(
        "diagnosticDetails"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const keyButton =
    document.getElementById(
        "keyButton"
    );


const keyModal =
    document.getElementById(
        "keyModal"
    );


const keyCloseButton =
    document.getElementById(
        "keyCloseButton"
    );


const keyContent =
    document.getElementById(
        "keyContent"
    );



/* =========================================================
   AIRPORT INPUTS
========================================================= */

document
    .getElementById(
        "fromAirport"
    )
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );

        }
    );


document
    .getElementById(
        "toAirport"
    )
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );

        }
    );



/* =========================================================
   SEARCH FORM
========================================================= */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const inputDate =
                document
                    .getElementById(
                        "flightDate"
                    )
                    .value;


            const from =
                document
                    .getElementById(
                        "fromAirport"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            const to =
                document
                    .getElementById(
                        "toAirport"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            if (
                !inputDate ||
                !from ||
                !to
            ) {

                return;

            }


            searchButton.disabled =
                true;


            statusEl.className =
                "";


            statusEl.textContent =
                "Loading flight data...";


            resultsEl.innerHTML =
                "";


            diagnosticEl.innerHTML =
                "Loading diagnostics...";


            try {


                /* -----------------------------------------
                   LOAD GOOGLE SHEET
                ----------------------------------------- */

                const rows =
                    await queryGoogleSheet();


                console.log(
                    "================================"
                );


                console.log(
                    "TOTAL ROWS LOADED:",
                    rows.length
                );


                console.log(
                    "================================"
                );


                /* -----------------------------------------
                   REQUESTED DATE
                ----------------------------------------- */

                const requestedDate =
                    parseDateParts(
                        inputDate
                    );


                /* -----------------------------------------
                   ROUTE MATCHING
                ----------------------------------------- */

                const routeMatches =
                    rows.filter(
                        function(row) {


                            const rowFrom =
                                normalizeAirport(
                                    row[
                                        COL.FROM
                                    ]
                                );


                            const rowTo =
                                normalizeAirport(
                                    row[
                                        COL.TO
                                    ]
                                );


                            return (

                                rowFrom === from &&

                                rowTo === to

                            );

                        }
                    );


                console.log(
                    "ROUTE MATCHES:",
                    routeMatches.length
                );


                /* -----------------------------------------
                   DEBUG ROWS
                ----------------------------------------- */

                let debugRows = "";


                routeMatches.forEach(
                    function(row, index) {


                        const rawDate =
                            row[
                                COL.FLIGHT_DATE
                            ];


                        const parsedDate =
                            parseDateParts(
                                rawDate
                            );


                        const match =
                            datesEqual(
                                parsedDate,
                                requestedDate
                            );


                        console.log(
                            "ROUTE RECORD",
                            index + 1,
                            {
                                rawDate:
                                    rawDate,

                                parsedDate:
                                    parsedDate,

                                from:
                                    row[
                                        COL.FROM
                                    ],

                                to:
                                    row[
                                        COL.TO
                                    ],

                                pulled:
                                    row[
                                        COL.DATA_PULLED
                                    ],

                                match:
                                    match
                            }
                        );


                        debugRows += `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        rawDate
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        formatDateParts(
                                            parsedDate
                                        )
                                    )}
                                </td>

                                <td>
                                    ${escapeHTML(
                                        row[
                                            COL.DATA_PULLED
                                        ] || ""
                                    )}
                                </td>

                                <td>

                                    ${
                                        match
                                            ? "YES"
                                            : "NO"
                                    }

                                </td>

                            </tr>

                        `;

                    }
                );


                /* -----------------------------------------
                   FINAL MATCHES
                ----------------------------------------- */

                const matches =
                    routeMatches.filter(
                        function(row) {


                            const rowDate =
                                parseDateParts(
                                    row[
                                        COL.FLIGHT_DATE
                                    ]
                                );


                            return datesEqual(
                                rowDate,
                                requestedDate
                            );

                        }
                    );


                /* -----------------------------------------
                   SORT NEWEST PULL FIRST
                ----------------------------------------- */

                matches.sort(
                    function(a, b) {

                        return (

                            compareDates(
                                b[
                                    COL.DATA_PULLED
                                ],
                                a[
                                    COL.DATA_PULLED
                                ]
                            )

                        );

                    }
                );


                /* -----------------------------------------
                   UPDATE DIAGNOSTICS
                ----------------------------------------- */

                diagnosticEl.innerHTML = `

                    <div class="diagnostic-title">

                        Search Diagnostics

                    </div>


                    Spreadsheet rows loaded:

                    <strong>
                        ${rows.length}
                    </strong>

                    <br>


                    ${escapeHTML(from)}
                    →
                    ${escapeHTML(to)}

                    route records:

                    <strong>
                        ${routeMatches.length}
                    </strong>

                    <br>


                    Requested date:

                    <strong>
                        ${escapeHTML(
                            formatDateParts(
                                requestedDate
                            )
                        )}
                    </strong>

                    <br>


                    Matching records:

                    <strong>
                        ${matches.length}
                    </strong>


                    <div class="route-debug">

                        <table>

                            <thead>

                                <tr>

                                    <th>
                                        #
                                    </th>

                                    <th>
                                        Raw Sheet Date
                                    </th>

                                    <th>
                                        Parsed Date
                                    </th>

                                    <th>
                                        Data Pulled
                                    </th>

                                    <th>
                                        Match
                                    </th>

                                </tr>

                            </thead>


                            <tbody>

                                ${debugRows}

                            </tbody>

                        </table>

                    </div>

                `;


                searchButton.disabled =
                    false;


                /* -----------------------------------------
                   NO RESULTS
                ----------------------------------------- */

                if (
                    matches.length === 0
                ) {

                    statusEl.textContent =
                        "No matching flight data was found.";

                    return;

                }


                /* -----------------------------------------
                   STATUS
                ----------------------------------------- */

                statusEl.textContent =

                    matches.length +

                    " matching record" +

                    (
                        matches.length === 1
                            ? ""
                            : "s"
                    ) +

                    " found.";


                /* -----------------------------------------
                   DISPLAY RESULTS
                ----------------------------------------- */

                resultsEl.innerHTML =

                    matches
                        .map(
                            buildResult
                        )
                        .join("");


            }


            catch(error) {


                console.error(
                    "SEARCH ERROR:",
                    error
                );


                searchButton.disabled =
                    false;


                statusEl.className =
                    "error";


                statusEl.textContent =

                    "Unable to read the Google Sheet: " +

                    (
                        error.message ||
                        "Unknown error."
                    );

            }

        }
    );



/* =========================================================
   LOAD MAIN GOOGLE SHEET
========================================================= */

async function queryGoogleSheet() {


    /*
     * Direct Google Sheets CSV export.
     *
     * This is the important fix that solved
     * the missing 08/18/2026 records.
     */

    const url =

        "https://docs.google.com/spreadsheets/d/" +

        SPREADSHEET_ID +

        "/export?format=csv&gid=" +

        MAIN_SHEET_GID;


    console.log(
        "GOOGLE SHEET EXPORT URL:",
        url
    );


    const response =
        await fetch(
            url,
            {
                cache: "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(

            "Google Sheet returned HTTP " +

            response.status

        );

    }


    const csv =
        await response.text();


    console.log(
        "CSV CHARACTER COUNT:",
        csv.length
    );


    if (
        !csv ||
        csv.trim() === ""
    ) {

        throw new Error(
            "Google Sheet returned no data."
        );

    }


    const rows =
        parseCSV(
            csv
        );


    console.log(
        "RAW CSV ROW COUNT:",
        rows.length
    );


    const dataRows =
        rows
            .slice(1)
            .filter(
                function(row) {

                    return row.some(
                        function(value) {

                            return (

                                String(value)
                                    .trim() !== ""

                            );

                        }
                    );

                }
            );


    console.log(
        "DATA ROWS:"
    );


    dataRows.forEach(
        function(row, index) {

            console.log(
                "ROW",
                index + 1,
                row
            );

        }
    );


    return dataRows;

}



/* =========================================================
   DATE PARSER
========================================================= */

function parseDateParts(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    let s =
        String(value)
            .trim();


    /*
     * Remove BOM.
     */

    s =
        s.replace(
            /^\uFEFF/,
            ""
        );


    /*
     * Remove quotes.
     */

    s =
        s.replace(
            /^"(.*)"$/,
            "$1"
        );


    /*
     * Google Date format:
     *
     * Date(2026,9,2)
     */

    let match =
        s.match(
            /Date\s*\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/
        );


    if (
        match
    ) {

        return {

            year:
                Number(
                    match[1]
                ),

            month:
                Number(
                    match[2]
                ) + 1,

            day:
                Number(
                    match[3]
                )

        };

    }


    /*
     * YYYY-MM-DD
     */

    match =
        s.match(
            /(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})/
        );


    if (
        match
    ) {

        return {

            year:
                Number(
                    match[1]
                ),

            month:
                Number(
                    match[2]
                ),

            day:
                Number(
                    match[3]
                )

        };

    }


    /*
     * MM/DD/YYYY
     */

    match =
        s.match(
            /(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{4})/
        );


    if (
        match
    ) {

        return {

            year:
                Number(
                    match[3]
                ),

            month:
                Number(
                    match[1]
                ),

            day:
                Number(
                    match[2]
                )

        };

    }


    /*
     * Embedded date.
     */

    match =
        s.match(
            /(\d{1,2})\D+(\d{1,2})\D+(\d{4})/
        );


    if (
        match
    ) {

        return {

            year:
                Number(
                    match[3]
                ),

            month:
                Number(
                    match[1]
                ),

            day:
                Number(
                    match[2]
                )

        };

    }


    return null;

}



/* =========================================================
   DATE EQUALITY
========================================================= */

function datesEqual(
    a,
    b
) {


    if (
        !a ||
        !b
    ) {

        return false;

    }


    return (

        Number(a.year) ===
        Number(b.year)

        &&

        Number(a.month) ===
        Number(b.month)

        &&

        Number(a.day) ===
        Number(b.day)

    );

}



/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateParts(
    date
) {


    if (
        !date
    ) {

        return "UNABLE TO PARSE";

    }


    return (

        String(
            date.month
        ).padStart(
            2,
            "0"
        )

        +

        "/"

        +

        String(
            date.day
        ).padStart(
            2,
            "0"
        )

        +

        "/"

        +

        String(
            date.year
        )

    );

}



/* =========================================================
   SORT DATES
========================================================= */

function compareDates(
    a,
    b
) {


    const dateA =
        parseDateParts(
            a
        );


    const dateB =
        parseDateParts(
            b
        );


    if (
        !dateA &&
        !dateB
    ) {

        return 0;

    }


    if (
        !dateA
    ) {

        return -1;

    }


    if (
        !dateB
    ) {

        return 1;

    }


    const keyA =

        dateA.year * 10000 +

        dateA.month * 100 +

        dateA.day;


    const keyB =

        dateB.year * 10000 +

        dateB.month * 100 +

        dateB.day;


    return keyA - keyB;

}



/* =========================================================
   AIRPORT NORMALIZATION
========================================================= */

function normalizeAirport(
    value

/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(
    text
) {


    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes =
        false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        const char =
            text[i];


        const nextChar =
            text[i + 1];


        /*
         * Quotes.
         */

        if (
            char === '"'
        ) {


            if (

                insideQuotes &&

                nextChar === '"'

            ) {

                value += '"';

                i++;

                continue;

            }


            insideQuotes =
                !insideQuotes;

            continue;

        }


        /*
         * Comma.
         */

        if (

            char === "," &&

            !insideQuotes

        ) {

            row.push(
                value
            );

            value = "";

            continue;

        }


        /*
         * Newline.
         */

        if (

            (
                char === "\n" ||
                char === "\r"
            )

            &&

            !insideQuotes

        ) {


            if (

                char === "\r" &&

                nextChar === "\n"

            ) {

                i++;

            }


            row.push(
                value
            );


            rows.push(
                row
            );


            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    /*
     * Last row.
     */

    if (

        value !== "" ||

        row.length > 0

    ) {

        row.push(
            value
        );


        rows.push(
            row
        );

    }


    return rows;

}



/* =========================================================
   NUMBER DISPLAY
========================================================= */

function numberOrDash(
    value
) {


    if (

        value === null ||

        value === undefined ||

        String(value).trim() === ""

    ) {

        return "—";

    }


    return value;

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
) {


    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

keyButton.addEventListener(

        );

            ) {

            }

        catch(error) {


            console.error(

            );

                '<br><br>' +

        ) {

);


function closeKey() {

    keyModal.classList.remove(
        "open"
    );

    keyModal.setAttribute(
        "aria-hidden",
        "true"
    );

}



/* =========================================================
   KEY SHEET
========================================================= */

async function queryKeySheet() {


    const url =

        "https://docs.google.com/spreadsheets/d/" +

        KEY_SPREADSHEET_ID +

        "/gviz/tq?sheet=Sheet1&headers=1&tqx=out:csv";


    const response =
        await fetch(
            url
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "Key spreadsheet returned HTTP " +
            response.status
        );

    }


    const csv =
        await response.text();


    const rows =
        parseCSV(
            csv
        );


    return rows
        .slice(1)
        .filter(
            function(row) {

                return row.some(
                    function(value) {

                        return (
                            String(value)
                                .trim() !== ""
                        );

                    }
                );

            }
        );

}
